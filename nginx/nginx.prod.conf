# =============================================================================
# Hanuman Marketing Portal — Production Nginx Config (UpCloud)
# Replace traintrack.work with your actual domain throughout this file
# SSL certificates managed by certbot (see upcloud-setup.sh)
# =============================================================================

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
  worker_connections 1024;
  use epoll;
  multi_accept on;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # ── Logging ────────────────────────────────────────────────────────────────
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
  access_log /var/log/nginx/access.log main;

  # ── Performance ────────────────────────────────────────────────────────────
  sendfile        on;
  tcp_nopush      on;
  tcp_nodelay     on;
  keepalive_timeout 65;
  server_tokens   off;

  # ── Compression ────────────────────────────────────────────────────────────
  gzip on;
  gzip_vary on;
  gzip_comp_level 5;
  gzip_min_length 1000;
  gzip_types text/plain text/css application/json application/javascript
             text/xml application/xml text/javascript image/svg+xml;

  # ── Rate limiting ──────────────────────────────────────────────────────────
  limit_req_zone $binary_remote_addr zone=leads:10m rate=5r/m;
  limit_req_zone $binary_remote_addr zone=sso:10m   rate=10r/s;

  # ── Security headers ───────────────────────────────────────────────────────
  add_header X-Frame-Options        "SAMEORIGIN"  always;
  add_header X-Content-Type-Options "nosniff"     always;
  add_header X-XSS-Protection       "1; mode=block" always;
  add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

  # ── Upstream ───────────────────────────────────────────────────────────────
  upstream lead    { server lead-service:5001;    keepalive 4; }
  upstream gateway { server gateway-service:5002; keepalive 4; }
  upstream spa     { server frontend:3000;        keepalive 8; }

  # ── HTTP → HTTPS redirect ──────────────────────────────────────────────────
  server {
    listen 80;
    server_name traintrack.work www.traintrack.work;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://traintrack.work$request_uri;
    }
  }

  # ── Redirect www → non-www ────────────────────────────────────────────────
  server {
    listen 443 ssl http2;
    server_name www.traintrack.work;

    ssl_certificate     /etc/letsencrypt/live/traintrack.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/traintrack.work/privkey.pem;

    return 301 https://traintrack.work$request_uri;
  }

  # ── HTTPS ──────────────────────────────────────────────────────────────────
  server {
    listen 443 ssl http2;
    server_name traintrack.work;

    ssl_certificate     /etc/letsencrypt/live/traintrack.work/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/traintrack.work/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Health check
    location = /health {
      access_log off;
      return 200 "ok\n";
      add_header Content-Type text/plain;
    }

    # Lead capture API (contact form submissions)
    location /api/leads/ {
      limit_req zone=leads burst=3 nodelay;
      proxy_pass         http://lead;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # SSO gateway — login redirect to TrainTrack
    location /api/gateway/ {
      limit_req zone=sso burst=10 nodelay;
      proxy_pass         http://gateway;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Lead service — contact form + newsletter signup
    location /api/contact {
      limit_req zone=leads burst=3 nodelay;
      proxy_pass         http://lead;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /api/subscribe {
      limit_req zone=leads burst=3 nodelay;
      proxy_pass         http://lead;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Spam Act unsubscribe — the human-facing confirm page's POST, and the
    # RFC 8058 one-click target mail clients (Gmail/Outlook) POST to directly
    # from the List-Unsubscribe header, no page involved.
    location /api/unsubscribe {
      limit_req zone=leads burst=3 nodelay;
      proxy_pass         http://lead;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Key-protected export of the current suppression list, for the sending
    # automation to pull before each campaign run.
    location /api/unsubscribed {
      limit_req zone=leads burst=3 nodelay;
      proxy_pass         http://lead;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Cold-email open-tracking pixel — loaded by the recipient's mail client,
    # so this needs a generous rate limit (it's not a human clicking).
    location /api/track/open {
      limit_req zone=sso burst=20 nodelay;
      proxy_pass         http://lead;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Key-protected export of open events, for the sending automation's
    # --report flag.
    location /api/opens {
      limit_req zone=leads burst=3 nodelay;
      proxy_pass         http://lead;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Lead service — pageview analytics (frequent; lenient limit)
    location /api/analytics/ {
      limit_req zone=sso burst=20 nodelay;
      proxy_pass         http://lead;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Static assets — long cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf)$ {
      proxy_pass         http://spa;
      proxy_set_header   Host $host;
      expires            1y;
      add_header         Cache-Control "public, immutable";
      access_log         off;
    }

    # React SPA (catch-all)
    location / {
      proxy_pass         http://spa;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }
  }
}
