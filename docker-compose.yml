# =============================================================================
# Hanuman — TrainTrack Marketing Website — Docker Compose
# Three-tier network segmentation: frontend / backend / data
# Run: docker compose up --build
# =============================================================================

# ---------------------------------------------------------------------------
# Named volumes
# ---------------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# ---------------------------------------------------------------------------
# Secrets — mounted as files at /run/secrets/<name>
# ---------------------------------------------------------------------------
secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt
  redis_password:
    file: ./secrets/redis_password.txt

# ---------------------------------------------------------------------------
# Networks — three-tier segmentation
#   frontend-net: nginx <-> frontend
#   backend-net:  nginx <-> lead-service
#   data-net:     lead-service <-> db + redis
# ---------------------------------------------------------------------------
networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
  data-net:
    driver: bridge
    internal: true
  gateway-net:
    external: true

# ---------------------------------------------------------------------------
# Services
# ---------------------------------------------------------------------------
services:

  # --------------------------------------------------------------------------
  # PostgreSQL 16 — Primary database
  # --------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: hanuman-db
    restart: unless-stopped
    environment:
      POSTGRES_USER:          ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB:            ${POSTGRES_DB}
      PGDATA:                 /var/lib/postgresql/data/pgdata
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - data-net
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # --------------------------------------------------------------------------
  # Redis — Rate limiter backend + session cache
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: hanuman-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 64mb
      --maxmemory-policy allkeys-lru
      --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - data-net
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # --------------------------------------------------------------------------
  # Lead Service (Flask) — port 5001
  # --------------------------------------------------------------------------
  lead-service:
    build:
      context: ./services/lead-service
      dockerfile: Dockerfile
    container_name: hanuman-lead-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL:   ${DATABASE_URL}
      REDIS_URL:      redis://:${REDIS_PASSWORD}@redis:6379/0
      CORS_ORIGINS:   ${CORS_ORIGINS}
      FLASK_ENV:      ${FLASK_ENV}
      FLASK_DEBUG:    ${FLASK_DEBUG}
      PORT:           ${LEAD_SERVICE_PORT}
    secrets:
      - postgres_password
      - redis_password
    networks:
      - backend-net
      - data-net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:${LEAD_SERVICE_PORT}/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --------------------------------------------------------------------------
  # Gateway Service (Flask) — port 5002
  # Proxies auth to TrainTrack, serves tenant branding data
  # --------------------------------------------------------------------------
  gateway-service:
    build:
      context: ./services/gateway-service
      dockerfile: Dockerfile
    container_name: hanuman-gateway-service
    restart: unless-stopped
    environment:
      TRAINTRACK_AUTH_URL: http://traintrack-auth:5001
      TRAINTRACK_DB_URL:   postgresql://${TRAINTRACK_DB_USER}:${TRAINTRACK_DB_PASS}@traintrack-db:5432/${TRAINTRACK_DB_NAME}
      REDIS_URL:           redis://:${REDIS_PASSWORD}@redis:6379/0
      CORS_ORIGINS:        ${CORS_ORIGINS}
    networks:
      - backend-net
      - gateway-net
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5002/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --------------------------------------------------------------------------
  # Frontend (React / Vite) — port 3000
  # --------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hanuman-frontend
    restart: unless-stopped
    ports:
      - "3100:3000"
    networks:
      - frontend-net
    depends_on:
      lead-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --------------------------------------------------------------------------
  # Nginx reverse proxy — ports 9080 / 9443
  # --------------------------------------------------------------------------
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: hanuman-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "9080:80"
      - "9443:443"
    networks:
      - frontend-net
      - backend-net
    depends_on:
      frontend:
        condition: service_healthy
      lead-service:
        condition: service_healthy
      gateway-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --------------------------------------------------------------------------
  # Locust — Load Testing (web UI on port 8089)
  # --------------------------------------------------------------------------
  locust:
    image: locustio/locust
    container_name: hanuman-locust
    restart: unless-stopped
    ports:
      - "8099:8089"
    volumes:
      - ./loadtest:/mnt/locust:ro
    command: -f /mnt/locust/locustfile.py --host=http://nginx
    networks:
      - frontend-net
      - backend-net
    depends_on:
      nginx:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # --------------------------------------------------------------------------
  # Test Runner — pytest integration tests (run on-demand)
  # Usage: docker compose run --rm test-runner
  # --------------------------------------------------------------------------
  test-runner:
    build:
      context: ./tests
      dockerfile: Dockerfile
    container_name: hanuman-tests
    environment:
      TEST_BASE_URL: https://nginx
    volumes:
      - ./tests/report:/tests/report
    networks:
      - frontend-net
      - backend-net
    depends_on:
      nginx:
        condition: service_healthy
    profiles:
      - test
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
