<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TrainTrack — Australia's RTO Management System</title>
  <link rel="icon" type="image/svg+xml" href="/traintrack-logo.svg" />
  <link rel="apple-touch-icon" href="/traintrack-logo.svg" />
  <meta name="theme-color" content="#0B2A26" />
  <meta name="google-site-verification" content="z961lV6A2T4t1Z2mhlqH9B7pKlXppwieVlpBNkyiKD4" />
  <!-- No static meta description here: every route sets its own via the Seo
       component. A hardcoded one here would sit alongside Helmet's per-page
       tag rather than being replaced by it, since react-helmet-async only
       manages tags it renders itself -- two <meta name="description"> tags
       is exactly the kind of thing that confuses search engines. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,300;1,9..40,400&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet" />
</head>
