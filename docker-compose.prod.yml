# =============================================================================
# Hanuman Marketing Portal — Production (UpCloud)
# Uses UpCloud Managed PostgreSQL — no local db container
# Deploy: ./deploy.sh
# =============================================================================

volumes:
  redis_data:
    driver: local

networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
  data-net:
    driver: bridge
    internal: true
  gateway-net:
    driver: bridge

services:

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: hanuman-redis
    restart: always
    command: >
      redis-server --appendonly yes --maxmemory 64mb
      --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - data-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits: { memory: 128M, cpus: '0.25' }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # ── Lead Service ───────────────────────────────────────────────────────────
  lead-service:
    image: hanuman-lead:${IMAGE_TAG:-latest}
    build:
      context: ./services/lead-service
      dockerfile: Dockerfile
    container_name: hanuman-lead-service
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL:    redis://:${REDIS_PASSWORD}@redis:6379/0
      CORS_ORIGINS: ${CORS_ORIGINS}
      FLASK_ENV:    production
      FLASK_DEBUG:  "0"
      PORT:         ${LEAD_SERVICE_PORT:-5001}
      # Email (transactional) — lead confirmations + sales notifications
      SMTP_HOST:          ${SMTP_HOST:-}
      SMTP_PORT:          ${SMTP_PORT:-587}
      SMTP_USER:          ${SMTP_USER:-}
      SMTP_PASSWORD:      ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL:    ${SMTP_FROM_EMAIL:-noreply@traintrack.work}
      SMTP_FROM_NAME:     ${SMTP_FROM_NAME:-TrainTrack}
      SMTP_TLS:           ${SMTP_TLS:-true}
      SALES_NOTIFY_EMAIL: ${SALES_NOTIFY_EMAIL:-}
      # Shared secret protecting /api/unsubscribed and /api/opens — the cold-email
      # automation's key-protected exports. Must match the value the sending
      # script is configured with.
      UNSUB_EXPORT_KEY:   ${UNSUB_EXPORT_KEY:-}
    networks: [backend-net, data-net]
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:${LEAD_SERVICE_PORT:-5001}/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits: { memory: 512M, cpus: '0.5' }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # ── Gateway Service (SSO proxy to TrainTrack) ──────────────────────────────
  gateway-service:
    image: hanuman-gateway:${IMAGE_TAG:-latest}
    build:
      context: ./services/gateway-service
      dockerfile: Dockerfile
    container_name: hanuman-gateway-service
    restart: always
    environment:
      TRAINTRACK_AUTH_URL:     ${TRAINTRACK_AUTH_URL}
      TRAINTRACK_FRONTEND_URL: ${TRAINTRACK_FRONTEND_URL}
      TRAINTRACK_DB_URL:       ${TRAINTRACK_DB_URL}
      PORTAL_URL:              ${PORTAL_URL:-}
      # SSO cookie sharing — REQUIRED so the JWT set at login on the portal
      # (traintrack.work) is also sent to the LMS (app.traintrack.work). Without
      # these the gateway defaults to domain=localhost and the cookie is rejected
      # by the browser → login succeeds for a moment then bounces to /manage.
      SSO_COOKIE_DOMAIN:       ${SSO_COOKIE_DOMAIN:-.traintrack.work}
      SSO_COOKIE_SECURE:       ${SSO_COOKIE_SECURE:-true}
      REDIS_URL:               redis://:${REDIS_PASSWORD}@redis:6379/0
      CORS_ORIGINS:            ${CORS_ORIGINS}
      # Email (transactional) — password reset
      SMTP_HOST:       ${SMTP_HOST:-}
      SMTP_PORT:       ${SMTP_PORT:-587}
      SMTP_USER:       ${SMTP_USER:-}
      SMTP_PASSWORD:   ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-noreply@traintrack.work}
      SMTP_FROM_NAME:  ${SMTP_FROM_NAME:-TrainTrack}
      SMTP_TLS:        ${SMTP_TLS:-true}
    networks: [backend-net, data-net]
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5002/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits: { memory: 256M, cpus: '0.5' }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    image: hanuman-frontend:${IMAGE_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hanuman-frontend
    restart: always
    networks:
      - frontend-net
    depends_on:
      lead-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits: { memory: 256M, cpus: '0.25' }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  # ── Nginx (SSL termination) ────────────────────────────────────────────────
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: hanuman-nginx
    restart: always
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:443"
    networks: [frontend-net, backend-net]
    depends_on:
      frontend:      { condition: service_healthy }
      lead-service:  { condition: service_healthy }
      gateway-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits: { memory: 256M, cpus: '0.5' }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
